# Author: support@lituus.io
# Copyright: lituus-io, all rights reserved

# Dependency policy: the only third-party crates [dependencies] may name are
# graph-r, link-r and objstore-r. Dev tooling (proptest, criterion, tokio,
# libfuzzer-sys) is allowed in [dev-dependencies] and the fuzz crate only.
# Enforced by scripts/check_deps.py.

[package]
name = "uu-crab-r"
version = "0.2.2"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Generative technical metadata for BigQuery: describe a project, dataset, table or SQL from its producing queries, lineage and values, each description checked against the data"
repository = "https://github.com/lituus-io/crab-r"
homepage = "https://github.com/lituus-io/crab-r"
documentation = "https://docs.rs/uu-crab-r"
readme = "README.md"
authors = ["lituus-io <support@lituus.io>"]
keywords = ["bigquery", "metadata", "lineage", "sql", "data-catalog"]
categories = ["database", "development-tools", "parser-implementations"]
exclude = ["/evals", "/fuzz", "/tests/live", "/bindings", "/.github", "/scripts", "/target-fuzz"]

[lib]
name = "crab_r"

[[bin]]
name = "crab-describe"
path = "src/bin/crab-describe.rs"
required-features = ["cli"]

[features]
default = []
# The authorised HTTPS transport (objstore-r) for BigQuery.
http = ["objstore-r/http"]
# Gemini on Vertex AI.
vertex = ["objstore-r/http"]
# OpenAI-compatible chat completions.
openai = ["objstore-r/http"]
# Dataplex lineage (Data Lineage API).
dataplex = ["objstore-r/http"]
# The `crab-describe` command and `describe::app`: BigQuery, Vertex AI and
# Dataplex over ADC, an OpenAI-compatible model as the alternative to Vertex
# AI, a blocking runtime, and store publishing to Cloud Storage through
# objstore-r's graph-r mirror.
cli = ["http", "vertex", "openai", "dataplex", "objstore-r/blocking", "objstore-r/gcs", "objstore-r/mirror"]

[package.metadata.docs.rs]
features = ["cli", "openai"]

[dependencies]
graph-r = { package = "uu-graph-r", path = "../graph-r", version = "0.4.0", default-features = false, features = ["store"] }
link-r = { package = "uu-link-r", path = "../link-r", version = "0.4.0", default-features = false }
objstore-r = { package = "uu-objstore-r", path = "../objstore-r", version = "0.2.0" }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", default-features = false }
# Live tests only: reqwest (inside objstore-r's `http`) needs a tokio reactor.
tokio = { version = "1.40", default-features = false, features = ["rt", "macros", "time"] }

[[test]]
name = "baseline_live"
required-features = ["vertex", "openai", "http"]

[[test]]
name = "sync_live"
required-features = ["http"]

[[bench]]
name = "bind_bench"
harness = false

[[bench]]
name = "catalog_bench"
harness = false

[[bench]]
name = "grammar_bench"
harness = false

[[bench]]
name = "ground_bench"
harness = false

[[bench]]
name = "hash_bench"
harness = false

[[bench]]
name = "link_bench"
harness = false

[[bench]]
name = "parse_bench"
harness = false

[[bench]]
name = "trace_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
lto = "fat"
debug = true
