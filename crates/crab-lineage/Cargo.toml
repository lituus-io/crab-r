[package]
name = "crab-lineage"
description = "crab-r column lineage: a column-level lineage graph (exact-copy edges, topological table order, nearest documented ancestors) fed by the SQL that produces each table or by the Dataplex lineage API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
dataplex = ["objstore-r/http"]

[dependencies]
crab-core = { workspace = true }
objstore-r = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
