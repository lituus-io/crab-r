[package]
name = "crab-grammar"
description = "crab-r output grammars: the CrabSQL language restricted to the tables and columns in context, emitted as Lark (vLLM / llguidance) or GBNF (llama.cpp) for grammar-constrained decoding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
crab-core = { workspace = true }

[dev-dependencies]
crab-sql = { workspace = true }
crab-ir = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "grammar"
harness = false
