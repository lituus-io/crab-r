[package]
name = "crab-exec"
description = "crab-r warehouse layer: a GAT Warehouse trait with dry-run cost guardrails and capped execution; BigQuery over objstore-r's authorised transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# The production transport (reqwest/rustls + ADC) for live BigQuery.
http = ["objstore-r/http"]

[dependencies]
crab-core = { workspace = true }
graph-r = { workspace = true }
objstore-r = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
