[package]
name = "crab-describe"
description = "crab-r Describe: evidence-driven table and column metadata for a whole dataset — producing SQL from job history, column lineage, profiles, model-written validation checks run under guards and judged, byte-exact schema output and etag-guarded apply"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
crab-core = { workspace = true }
crab-sql = { workspace = true }
crab-ir = { workspace = true }
crab-catalog = { workspace = true }
crab-exec = { workspace = true }
crab-llm = { workspace = true }
crab-lineage = { workspace = true }
crab-meta = { workspace = true }
objstore-r = { workspace = true }
graph-r = { workspace = true }

[features]
default = []
# The `crab-describe` command-line tool: BigQuery, Gemini on Vertex AI and
# Dataplex lineage over ADC, driven by objstore-r's blocking runtime.
cli = ["objstore-r/blocking", "crab-llm/vertex", "crab-lineage/dataplex"]

[[bin]]
name = "crab-describe"
path = "src/bin/crab-describe.rs"
required-features = ["cli"]

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "trace"
harness = false
