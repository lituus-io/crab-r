[package]
name = "crab-llm"
description = "crab-r model layer: a vendor-neutral GAT Model trait with capability and price descriptors, streaming with per-candidate abort, Vertex AI, OpenAI-compatible and replay backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# Gemini on Vertex AI over objstore-r's authorised HTTPS transport.
vertex = ["objstore-r/http"]
openai = ["objstore-r/http"]

[dependencies]
crab-core = { workspace = true }
graph-r = { workspace = true }
# Always needed for the dependency-free `transport` trait and `Bytes`.
objstore-r = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
