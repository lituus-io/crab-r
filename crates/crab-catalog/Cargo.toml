[package]
name = "crab-catalog"
description = "crab-r catalog: a zero-copy, checksummed, mmap-able catalog image of BigQuery datasets, tables and nested columns, built from INFORMATION_SCHEMA in one concurrent sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
crab-core = { workspace = true }
crab-exec = { workspace = true }
graph-r = { workspace = true }
# Only for the audited read-only mmap island (link_r::index::mmap).
link-r = { workspace = true }
objstore-r = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Live tests only: the production HTTPS transport.
objstore-r = { workspace = true, features = ["http"] }
tokio = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "catalog"
harness = false
