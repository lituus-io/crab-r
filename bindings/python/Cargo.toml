[package]
name = "crab-r-python"
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Python bindings for crab-r (PyO3): describe BigQuery projects, datasets, tables and SQL."
publish = false

[lib]
name = "crab_r"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312: one wheel per platform serves every Python from 3.12 up.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
# The command's library form: the same options, run and lookups as the
# `crab-describe` binary, so the two never drift.
# Aliased to `crab` because this crate's own lib is `crab_r` (the module).
crab = { package = "uu-crab-r", path = "../..", features = ["cli"] }
objstore-r = { package = "uu-objstore-r", path = "../../../objstore-r", features = ["blocking"] }

# Detach from the parent workspace so the main `cargo test` never needs Python.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
