[package]
name = "crab-r-python"
version = "0.5.1"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Python bindings for crab-r (PyO3): describe BigQuery projects, datasets, tables and SQL."
publish = false

[lib]
name = "crab_r"
crate-type = ["cdylib"]

[dependencies]
# abi3-py312: one wheel per platform serves every Python from 3.12 up.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"] }
# The command's library form: the same options, run and lookups as the
# `crab-describe` binary, so the two never drift.
# Aliased to `crab` because this crate's own lib is `crab_r` (the module).
crab = { package = "uu-crab-r", path = "../..", features = ["cli"] }
objstore-r = { package = "uu-objstore-r", path = "../../../objstore-r", features = ["http"] }
graph-r = { package = "uu-graph-r", path = "../../../graph-r", default-features = false, features = ["store"] }
# The one process-wide runtime every call shares (already in the tree
# through objstore-r's HTTP stack; this names its multi-thread scheduler).
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "sync"] }
# Awaitables on that runtime; cancelling the Python future drops the Rust one.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

[features]
# Test seams: `_set_test_origin` sends queries to a loopback stub.
testing = ["crab/testing"]

# Detach from the parent workspace so the main `cargo test` never needs Python.
[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
