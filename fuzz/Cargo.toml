[package]
name = "crab-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crab-r = { package = "uu-crab-r", path = "..", features = ["dataplex", "cli"] }
graph-r = { package = "uu-graph-r", path = "../../graph-r" }
objstore-r = { package = "uu-objstore-r", path = "../../objstore-r" }

[[bin]]
name = "fuzz_json"
path = "fuzz_targets/fuzz_json.rs"
test = false
doc = false
bench = false

