[package]
name = "crab-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
crab-core = { path = "../crates/crab-core" }
crab-llm = { path = "../crates/crab-llm" }
crab-sql = { path = "../crates/crab-sql" }
crab-catalog = { path = "../crates/crab-catalog" }
crab-ir = { path = "../crates/crab-ir" }
crab-values = { path = "../crates/crab-values" }
crab-grammar = { path = "../crates/crab-grammar" }
crab-describe = { path = "../crates/crab-describe" }
crab-meta = { path = "../crates/crab-meta" }
crab-lineage = { path = "../crates/crab-lineage", features = ["dataplex"] }
graph-r = { path = "../../../code_backup/graph-r" }
objstore-r = { path = "../../../code_backup/objstore-r" }

[[bin]]
name = "fuzz_json"
path = "fuzz_targets/fuzz_json.rs"
test = false
doc = false
bench = false

